    - "def print_projection():\n    w = float(globals().get('width', 100)); h = float(globals().get('height', 100))\n    zc = (h / 2.0) / _math.tan(_math.pi / 6)\n    name, a = _proj_args[0] or ('perspective', (_math.pi / 3, w / h, zc / 10, zc * 10))\n    a = [float(v) for v in a]\n    if name == 'perspective':\n        fov, asp, n, f = (a + [_math.pi / 3, w / h, zc / 10, zc * 10][len(a):])[:4]\n        t = 1.0 / _math.tan(fov / 2)\n        _print_mat([[t / asp, 0, 0, 0], [0, t, 0, 0], [0, 0, (f + n) / (n - f), 2 * f * n / (n - f)], [0, 0, -1, 0]])\n    elif name == 'ortho':\n        l, r, b, t, n, f = (a + [-w / 2, w / 2, -h / 2, h / 2, 0.0, max(w, h)][len(a):])[:6]\n        _print_mat([[2 / (r - l), 0, 0, -(r + l) / (r - l)], [0, 2 / (t - b), 0, -(t + b) / (t - b)], [0, 0, -2 / (f - n), -(f + n) / (f - n)], [0, 0, 0, 1]])\n    else:\n        l, r, b, t, n, f = a[:6]\n        _print_mat([[2 * n / (r - l), 0, (r + l) / (r - l), 0], [0, 2 * n / (t - b), (t + b) / (t - b), 0], [0, 0, (f +\
      \ n) / (n - f), 2 * f * n / (n - f)], [0, 0, -1, 0]])"
  syntax: (print-projection)
