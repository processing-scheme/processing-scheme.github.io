- slug: noise
  name: (noise)
  cat_tag: Math / Random
  description: Returns the Perlin noise value at specified coordinates. Produces smoother and more natural sequences than random().
  related:
  - noiseSeed
  - noiseDetail
  - random
  params:
  - name: x
    type: number
    desc: x-coordinate in noise space
  - name: y
    type: number
    desc: y-coordinate (optional)
  - name: z
    type: number
    desc: z-coordinate (optional)
  returns: number
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def noise(x, y=0.0, z=0.0):\n    tot = 0.0; amp = 0.5; f = 1.0; norm = 0.0\n    for k in range(_noise_oct):\n        o = _noise_off[k % 8]\n        tot += amp * (_perlin(x * f + o, y * f + o, z * f + o) * 0.5 + 0.5)\n        norm += amp; amp *= _noise_fall; f *= 2\n    return min(1.0, max(0.0, tot / norm))"
