- slug: clip
  name: (clip)
  cat_tag: Rendering
  description: Limits the rendering to a rectangular area. Only pixels inside the clip region will be drawn.
  related:
  - noClip
  params:
  - name: x
    type: number
    desc: x-coordinate
  - name: y
    type: number
    desc: y-coordinate
