- slug: bezierPoint
  name: (bezier-point)
  cat_tag: Shape / Curves
  description: Evaluates the bezier at parameter t, returning a point on the curve.
  related:
  - bezier
  - bezierTangent
  params:
  - name: a
    type: number
    desc: coordinate of first point
  - name: b
    type: number
    desc: coordinate of first control point
  - name: c
    type: number
    desc: coordinate of second control point
  - name: d
    type: number
    desc: coordinate of second point
  - name: t
    type: number
    desc: value between 0 and 1
  returns: number
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def bezier_point(a, b, c, d, t):\n    mt = 1.0 - t\n    return mt * mt * mt * a + 3 * mt * mt * t * b + 3 * mt * t * t * c + t * t * t * d"
  syntax: (bezier-point a b c d t)
