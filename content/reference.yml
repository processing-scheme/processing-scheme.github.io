  - name: h
    type: number
    desc: height of clip region
  returns: ''
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def clip(x, y, w, h):\n    sx = globals().get('screen_x'); sy = globals().get('screen_y')\n    if callable(sx) and callable(sy) and not _mode3d[0]:\n        pts = [(sx(a, b), sy(a, b)) for a, b in ((x, y), (x + w, y), (x, y + h), (x + w, y + h))]\n        xs = [q[0] for q in pts]; ys = [q[1] for q in pts]\n        return _clip_screen(min(xs), min(ys), max(xs) - min(xs), max(ys) - min(ys))\n    return _clip_screen(x, y, w, h)"
  syntax: (clip x y w h)
