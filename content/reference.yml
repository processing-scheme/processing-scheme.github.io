  params:
  - name: a
    type: number
    desc: coordinate of first point
  - name: b
    type: number
    desc: coordinate of first control point
  - name: c
    type: number
    desc: coordinate of second control point
  - name: d
    type: number
    desc: coordinate of second point
  - name: t
    type: number
    desc: value between 0 and 1
  returns: number
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def bezier_tangent(a, b, c, d, t):\n    return 3 * t * t * (-a + 3 * b - 3 * c + d) + 6 * t * (a - 2 * b + c) + 3 * (-a + b)"
