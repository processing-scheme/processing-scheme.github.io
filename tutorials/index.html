<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorials | Processing Scheme Mode</title>
<meta name="author" content="llamasjc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', sans-serif; color: #222; background: #fff; }
  .layout { display: flex; min-height: calc(100vh - 50px); }
  .sidebar-outer { width: 220px; flex-shrink: 0; border-right: 1px solid #eee; padding: 12px 8px; background: #fff; }
  .page-body { flex: 1; min-width: 0; padding: 2.5rem 3rem; max-width: 900px; }
  h1 { font-size: 2rem; font-weight: 600; margin-bottom: 1rem; color: #8a4fd1; }
  h2 { font-size: 1.25rem; font-weight: 600; margin: 2rem 0 0.75rem; color: #5f3394; }
  p { line-height: 1.8; color: #444; margin-bottom: 1rem; }
  a { color: #5f3394; }
  .notice { border-left: 4px solid #8a4fd1; background: #fafafa; padding: 1rem 1.25rem; border-radius: 4px; margin: 1.5rem 0; }
  .btn { display: inline-block; background: #8a4fd1; color: #fff; padding: 0.6rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 600; margin-right: 0.5rem; }
  .btn.ghost { background: none; color: #5f3394; border: 1px solid #8a4fd1; }
  .mode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-top: 1rem; }
  .mode-card { display: block; border: 1px solid #eee; border-top: 4px solid var(--mc); border-radius: 8px; padding: 1rem; text-decoration: none; color: #222; }
  .mode-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  .mode-card strong { display: block; color: var(--mc); margin-bottom: 0.25rem; }
  .mode-card span { font-size: 0.85rem; color: #777; }
  footer { border-top: 1px solid #eee; padding: 1.5rem 3rem; font-size: 0.8rem; color: #999; }
  @media (max-width: 800px) {
    .sidebar-outer { position: fixed; top: 0; left: -240px; height: 100%; z-index: 50; transition: left 0.2s; box-shadow: 2px 0 12px rgba(0,0,0,0.08); }
    .sidebar-outer.open { left: 0; }
    .page-body { padding: 1.5rem 1rem; }
    footer { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>
<nav id="site-nav"></nav>
<div class="layout">
  <div class="sidebar-outer"><div id="site-sidebar"></div></div>
  <div class="page-body">
    <h1>Tutorials</h1>
    <p>Tutorials written for Scheme are on the way. Until then, the concepts in the C++ Mode tutorials carry over almost one to one, since every mode uses the same Processing API on top of libprocessing.</p>
    <p><a class="btn" href="https://processing-cpp.github.io/tutorials/">Read the C++ tutorials</a></p>

  </div>
</div>
<footer>Contact: <a href="mailto:pep84c@gmail.com">pep84c@gmail.com</a></footer>
<script src="../assets/nav.js"></script>
</body>
</html>
