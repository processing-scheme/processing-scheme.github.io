- slug: printCamera
  name: (print-camera)
  cat_tag: Lights Camera / Camera
  description: Prints the current camera matrix to the console.
  related:
  - camera
  - printProjection
  params: []
  returns: ''
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def print_camera():\n    w = float(globals().get('width', 100)); h = float(globals().get('height', 100))\n    zc = (h / 2.0) / _math.tan(_math.pi / 6)\n    a = _cam_args[0] or (w / 2, h / 2, zc, w / 2, h / 2, 0.0, 0.0, 1.0, 0.0)\n    ex, ey, ez, cx, cy, cz = (float(v) for v in a[:6])\n    ux, uy, uz = (float(v) for v in a[6:9]) if len(a) >= 9 else (0.0, 1.0, 0.0)\n    fx, fy, fz = cx - ex, cy - ey, cz - ez; fl = _math.sqrt(fx * fx + fy * fy + fz * fz) or 1.0\n    fx, fy, fz = fx / fl, fy / fl, fz / fl\n    sx, sy, sz = fy * uz - fz * uy, fz * ux - fx * uz, fx * uy - fy * ux; sl = _math.sqrt(sx * sx + sy * sy + sz * sz) or 1.0\n    sx, sy, sz = sx / sl, sy / sl, sz / sl\n    tx, ty, tz = sy * fz - sz * fy, sz * fx - sx * fz, sx * fy - sy * fx\n    _print_mat([[sx, sy, sz, -(sx * ex + sy * ey + sz * ez)], [tx, ty, tz, -(tx * ex + ty * ey + tz * ez)],\n                [-fx, -fy, -fz, fx * ex + fy * ey + fz * ez], [0.0, 0.0, 0.0, 1.0]])"
  syntax: (print-camera)
