entries:
- slug: BufferedReader_class
  name: BufferedReader
  cat_tag: Data / Composite
  description: 'Reads text from a file line by line. Create with create-reader. Close when done. Methods take the object first: v.add(w) is (add v w).'
  related:
  - createReader
  - loadStrings
  params: []
  returns: BufferedReader
  uth: []
  syntax: (define in (create-reader "file.txt"))
  methods:
  - sig: (read-line in)
    desc: Reads and returns the next line as string. Returns empty string at EOF.
  - sig: (close in)
    desc: Closes the file
- slug: HashMap_class
  name: HashMap
  cat_tag: Data / Composite
  description: 'A templated key-value map. In Scheme Mode, map and unordered_map from the standard library are often more idiomatic, but HashMap is available for Processing Java compatibility. Methods take the object first: v.add(w) is (add v w).'
  related: []
  params: []
  returns: hash table
  uth: []
  syntax: '(define m (make-hash-table))

    (hash-table-set! m "key" 1)

    (hash-table-ref m "key")'
  methods:
  - sig: (put m k v)
    desc: Inserts or updates a key-value pair
  - sig: (get m k)
    desc: Returns reference to value for key
  - sig: (remove m k)
    desc: Removes a key-value pair
  - sig: (size m)
    desc: Returns number of entries
  - sig: (clear m)
    desc: Removes all entries
  - sig: (values m)
    desc: Returns a vector of all values
- slug: PFont_class
  name: PFont
  cat_tag: Data / Composite
  description: 'Datatype for storing fonts. Load with load-font or create with create-font. Methods take the object first: v.add(w) is (add v w).'
  related:
  - loadFont
  - createFont
  - textFont
  params: []
  returns: font
  uth: []
  syntax: (define f (create-font "name" size))
  methods: []
- slug: PGraphics_class
  name: PGraphics
  cat_tag: Data / Composite
  description: 'An off-screen graphics buffer. Create with create-graphics. Draw into it with begin-draw/end-draw, then display with image(). Methods take the object first: v.add(w) is (add v w).'
  related:
  - createGraphics
  - image
  params: []
  returns: graphics
  uth: []
  syntax: (define pg (create-graphics w h))
  methods:
  - sig: (begin-draw pg)
    desc: Start drawing to the buffer
  - sig: (end-draw pg)
    desc: Stop drawing to the buffer
  - sig: (background pg r g b)
    desc: Clear the buffer
  - sig: (fill pg r g b)
    desc: Set fill color
  - sig: (stroke pg r g b)
    desc: Set stroke color
  - sig: (ellipse pg x y w h)
    desc: Draw ellipse
  - sig: (rect pg x y w h)
    desc: Draw rectangle
- slug: PImage_class
  name: PImage
  cat_tag: Data / Composite
  description: 'Datatype for storing and manipulating images. Load with load-image or create with create-image. Methods take the object first: v.add(w) is (add v w).'
  related:
  - loadImage
  - createImage
  - image
  params: []
  returns: image
  uth: []
  syntax: (define img (load-image "file.png"))
  methods:
  - sig: (load-pixels img)
    desc: Load pixel data into pixels[]
  - sig: (update-pixels img)
    desc: Update image from pixels[]
  - sig: (get img x y)
    desc: Get pixel color at position
  - sig: (set img x y c)
    desc: Set pixel color at position
  - sig: (resize img w h)
    desc: Resize the image
  - sig: (filter img mode)
    desc: Apply an image filter
  - sig: (mask img m)
    desc: Apply an alpha mask
- slug: PShape_class
  name: PShape
  cat_tag: Data / Composite
  description: 'Datatype for storing shapes. Load with load-shape or build programmatically with create-shape. Methods take the object first: v.add(w) is (add v w).'
  related:
  - loadShape
  - createShape
  - shape
  params: []
  returns: shape
  uth: []
  syntax: (define s (load-shape "file.svg"))
  methods:
  - sig: (get-child s i)
    desc: Get child shape by index
  - sig: (get-child s name)
    desc: Get child shape by name/id
  - sig: (get-child-count s)
    desc: Number of children
  - sig: (get-vertex s i)
    desc: Get vertex by index as PVector
  - sig: (get-vertex-count s)
    desc: Number of vertices
  - sig: (set-vertex s i x y)
    desc: Set vertex position
  - sig: (disable-style s)
    desc: Ignore the shape's own fill/stroke
  - sig: (enable-style s)
    desc: Use the shape's own fill/stroke
  - sig: (set-fill s r g b)
    desc: Set fill color
  - sig: (set-stroke s r g b)
    desc: Set stroke color
- slug: PVector
  name: PVector
  cat_tag: Data / Composite
  description: 'A class to describe a two or three dimensional vector. Commonly used to represent position, velocity, or direction. Methods take the object first: v.add(w) is (add v w).'
  related: []
  params: []
  returns: vector
  uth: []
  syntax: (define v (PVector x y))
  methods:
  - sig: (mag v)
    desc: Magnitude (length) of the list
  - sig: (mag-sq v)
    desc: Magnitude squared
  - sig: (add v v2)
    desc: Add another vector
  - sig: (sub v v2)
    desc: Subtract another vector
  - sig: (mult v s)
    desc: Multiply by scalar
  - sig: (div v s)
    desc: Divide by scalar
  - sig: (normalize v)
    desc: Normalize to unit length
  - sig: (limit v max)
    desc: Limit the magnitude
  - sig: (set-mag v m)
    desc: Set the magnitude
  - sig: (dot v v2)
    desc: Dot product
  - sig: (cross v v2)
    desc: Cross product
  - sig: (dist v v2)
    desc: Distance to another vector
  - sig: (heading v)
    desc: Angle the list makes with positive x-axis
  - sig: (angle-between v v2)
    desc: Angle between two vectors
  - sig: (lerp v v2 t)
    desc: Interpolate towards another vector
  - sig: (rotate v angle)
    desc: Rotate by an angle (2D)
  - sig: (copy v)
    desc: Return a copy
  - sig: (to-string v)
    desc: String representation
- slug: PrintWriter_class
  name: PrintWriter
  cat_tag: Data / Composite
  description: 'Writes text to a file. Create with create-writer. Always call close() or flush() when done. Methods take the object first: v.add(w) is (add v w).'
  related:
  - createWriter
  - saveStrings
  params: []
  returns: PrintWriter
  uth: []
  syntax: (define out (create-writer "file.txt"))
  methods:
  - sig: (print out v)
    desc: Writes a value without a newline
  - sig: (println out v)
    desc: Writes a value followed by a newline
  - sig: (println out)
    desc: Writes a blank line
  - sig: (flush out)
    desc: Flushes the buffer to disk
  - sig: (close out)
    desc: Closes the file
- slug: TableRow_class
  name: TableRow
  cat_tag: Data / Composite
  description: 'Represents a single row in a Table. Access values by column index or name. Methods take the object first: v.add(w) is (add v w).'
  related:
  - Table_class
  - loadTable
  params: []
  returns: table row
  uth: []
  syntax: (define row (get-row t 0))
  methods:
  - sig: (get-string row i)
    desc: Gets value at column index as string
  - sig: (get-string row col)
    desc: Gets value by column name as string
  - sig: (get-int row i)
    desc: Gets value at column index as int
  - sig: (get-float row i)
    desc: Gets value at column index as float
  - sig: (set-string row i v)
    desc: Sets value at column index
  - sig: (set-int row i v)
    desc: Sets value as int
  - sig: (set-float row i v)
    desc: Sets value as float
- slug: Table_class
  name: Table
  cat_tag: Data / Composite
  description: 'Stores data in rows and columns like a spreadsheet. Load with load-table. Column names are set by the header row. Methods take the object first: v.add(w) is (add v w).'
  related:
  - loadTable
  - saveTable
  - TableRow_class
  params: []
  returns: table
  uth: []
  syntax: (define t (load-table "data.csv" "header"))
  methods:
  - sig: (add-column t name)
    desc: Adds a column
  - sig: (add-row t)
    desc: Adds a new row, returns reference
  - sig: (get-row-count t)
    desc: Returns number of rows
  - sig: (get-column-count t)
    desc: Returns number of columns
  - sig: (get-string t row col)
    desc: Gets a cell value as string
  - sig: (get-string t row col)
    desc: Gets a cell value by column name
  - sig: (get-int t row col)
    desc: Gets a cell value as int
  - sig: (get-float t row col)
    desc: Gets a cell value as float
  - sig: (set-string t row col v)
    desc: Sets a cell value
  - sig: (set-int t row col v)
    desc: Sets a cell value as int
  - sig: (set-float t row col v)
    desc: Sets a cell value as float
  - sig: (remove-row t i)
    desc: Removes a row
- slug: XML_class
  name: XML
  cat_tag: Data / Composite
  description: 'Represents an XML element. Load with load-xml or parse-xml. Access children and attributes by name. Methods take the object first: v.add(w) is (add v w).'
  related:
  - loadXML
  - parseXML
  - saveXML
  params: []
  returns: xml
  uth: []
  syntax: (define x (load-xml "data.xml"))
  methods:
  - sig: (get-name x)
    desc: Returns the name of the element
  - sig: (get-content x)
    desc: Returns the text content of the element
  - sig: (set-content x c)
    desc: Sets the text content
  - sig: (add-child x name)
    desc: Adds a child element
  - sig: (get-child x i)
    desc: Gets child by index
  - sig: (get-child x name)
    desc: Gets child by tag name
  - sig: (get-child-count x)
    desc: Returns number of children
  - sig: (get-children x name)
    desc: Returns all children with given tag name
- slug: append
  name: (append)
  cat_tag: Data / Array Functions
  description: Expands a list by one element and adds value to the end.
  related:
  - concat
  - expand
  - shorten
  params:
  - name: arr
    type: list
    desc: the list to expand
  - name: val
    type: any
    desc: the value to add
  returns: list
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - 'def append(*args): return [x for lst in args for x in (lst if isinstance(lst, _SEQ) else [lst])]'
  syntax: (append arr val)
- slug: arrayCopy
  name: (array-copy)
  cat_tag: Data / Array Functions
  description: Copies the contents of one vector into another.
  related:
  - concat
  - subset
  params:
  - name: src
    type: list
    desc: source vector
  - name: dst
    type: list
    desc: destination vector
  returns: ''
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def array_copy(src, *a):\n    if len(a) == 1: dst = a[0]; sp = 0; dp = 0; n = len(src)\n    elif len(a) == 2: dst, n = a; sp = 0; dp = 0\n    else: sp, dst, dp, n = a[0], a[1], a[2], a[3]\n    for i in range(int(n)): dst[int(dp) + i] = src[int(sp) + i]"
  syntax: (array-copy src dst)
- slug: concat
  name: (concat)
  cat_tag: Data / Array Functions
  description: Concatenates two lists.
  related:
  - append
  - splice
  params:
  - name: a
    type: list
    desc: first vector
  - name: b
    type: list
    desc: second vector
  returns: list
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - 'def concat(a, b): return list(a) + list(b)'
  syntax: (concat a b)
- slug: expand
  name: (expand)
  cat_tag: Data / Array Functions
  description: Increases the size of a list. With no second argument, doubles the size.
  related:
  - append
  - shorten
  params:
  - name: arr
    type: list
    desc: the list to expand
  - name: n
    type: integer
    desc: new size (optional, default doubles)
  returns: list
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def expand(lst, n=None):\n    lst = list(lst)\n    n = int(n) if n is not None else max(1, len(lst) * 2)\n    if all(isinstance(v, (int, float)) and not isinstance(v, bool) for v in lst): pad = 0\n    elif lst and all(isinstance(v, str) for v in lst): pad = ''\n    else: pad = False\n    return lst + [pad] * max(0, n - len(lst))"
  syntax: '(expand arr)

    (expand arr n)'
- slug: reverse_arr
  name: (reverse)
  cat_tag: Data / Array Functions
  description: Reverses the order of a list.
  related:
  - sort_arr
  params:
  - name: arr
    type: list
    desc: the list to reverse
  returns: list
  uth: []
  syntax: (reverse arr)
- slug: shorten
  name: (shorten)
  cat_tag: Data / Array Functions
  description: Decreases a list by one element. Removes the last element.
  related:
  - append
  - expand
  params:
  - name: arr
    type: list
    desc: the list to shorten
  returns: list
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - 'def shorten(lst): return list(lst)[:-1]'
  syntax: (shorten arr)
- slug: sort_arr
  name: (sort)
  cat_tag: Data / Array Functions
  description: Sorts a list in ascending order.
  related:
  - reverse_arr
  params:
  - name: arr
    type: list
    desc: the list to sort
  returns: list
  uth: []
  syntax: (sort arr)
- slug: splice
  name: (splice)
  cat_tag: Data / Array Functions
  description: Inserts a value or vector of values into an existing vector at the given index.
  related:
  - concat
  - append
  params:
  - name: arr
    type: list
    desc: the source vector
  - name: val
    type: any
    desc: value to insert
  - name: i
    type: integer
    desc: position to insert at
  returns: list
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def splice(lst, value, index):\n    l = list(lst); i = int(index)\n    vals = list(value) if isinstance(value, _SEQ) and not isinstance(value, str) else [value]\n    return l[:i] + vals + l[i:]"
  syntax: (splice arr val i)
- slug: subset
  name: (subset)
  cat_tag: Data / Array Functions
  description: Extracts an array of elements from an existing vector.
  related:
  - splice
  - append
  params:
  - name: arr
    type: list
    desc: the source vector
  - name: start
    type: integer
    desc: starting index
  - name: count
    type: integer
    desc: number of elements (optional)
  returns: list
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def subset(a, start, count=None):\n    lst = list(a); start = int(start)\n    return lst[start:] if count is None else lst[start:start + int(count)]"
  syntax: '(subset arr start)

    (subset arr start count)'
- slug: binary
  name: (binary)
  cat_tag: Data / Conversion
  description: Converts an integer to a binary string representation (32 characters).
  related:
  - unbinary
  - hex
  params:
  - name: v
    type: integer
    desc: value to convert
  returns: string
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def binary(v, digits=None):\n    s = format(v, 'b')\n    return s.rjust(digits, '0')[-digits:] if digits else s"
  syntax: (binary v)
- slug: hex
  name: (hex)
  cat_tag: Data / Conversion
  description: Converts an integer to a hexadecimal string.
  related:
  - unhex
  - binary
  params:
  - name: v
    type: integer
    desc: value to convert
  - name: digits
    type: integer
    desc: number of digits (optional)
  returns: string
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def hex(v, digits=None):\n    s = format(v & 0xFFFFFFFF if v < 0 else v, 'X')\n    return s.rjust(digits, '0')[-digits:] if digits else s.rjust(8, '0') if isinstance(v, int) and v > 0xFFFF else s"
  syntax: '(hex v)

    (hex v digits)'
