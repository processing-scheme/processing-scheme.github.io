- slug: curvePoint
  name: (curve-point)
  cat_tag: Shape / Curves
  description: Evaluates the Catmull-Rom curve at parameter t.
  related:
  - curve
  - curveTangent
  params:
  - name: a
    type: number
    desc: coordinate of first control point
  - name: b
    type: number
    desc: coordinate of first point
  - name: c
    type: number
    desc: coordinate of second point
  - name: d
    type: number
    desc: coordinate of second control point
  - name: t
    type: number
    desc: value between 0 and 1
  returns: number
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def curve_point(a, b, c, d, t):\n    k = (1.0 - _tight[0]) / 2.0\n    m1 = k * (c - a); m2 = k * (d - b); t2 = t * t; t3 = t2 * t\n    return (2 * t3 - 3 * t2 + 1) * b + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * c + (t3 - t2) * m2"
  syntax: (curve-point a b c d t)
- slug: curveTangent
  name: (curve-tangent)
  cat_tag: Shape / Curves
  description: Calculates the tangent of a point on a Catmull-Rom curve.
  related:
  - curve
  - curvePoint
  params:
  - name: a
    type: number
    desc: coordinate of first control point
  - name: b
    type: number
    desc: coordinate of first point
  - name: c
    type: number
    desc: coordinate of second point
  - name: d
    type: number
    desc: coordinate of second control point
  - name: t
    type: number
    desc: value between 0 and 1
  returns: number
  uth:
  - - src/java/processing/mode/scheme/Transpiler.java, the Python every sketch runs with
    - "def curve_tangent(a, b, c, d, t):\n    k = (1.0 - _tight[0]) / 2.0\n    m1 = k * (c - a); m2 = k * (d - b); t2 = t * t\n    return (6 * t2 - 6 * t) * b + (3 * t2 - 4 * t + 1) * m1 + (-6 * t2 + 6 * t) * c + (3 * t2 - 2 * t) * m2"
  syntax: (curve-tangent a b c d t)
